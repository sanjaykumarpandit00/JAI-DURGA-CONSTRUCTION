<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thank You | Jai Durga Construction</title>

  <link rel="icon" type="image/jpeg" href="logo.jpg">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      background: #050505;
      color: #fff;
      font-family: 'Poppins', sans-serif;
    }

    .container {
      max-width: 650px;
      padding: 50px 30px;
      background: #111;
      border: 1px solid #d4af37;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
    }

    .logo {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 25px;
      box-shadow: 0 0 25px #d4af37;
    }

    .check {
      font-size: 55px;
      color: #d4af37;
      margin-bottom: 15px;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 42px;
      color: #d4af37;
      margin-bottom: 20px;
    }

    p {
      font-size: 17px;
      line-height: 1.8;
      color: #eee;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      padding: 13px 30px;
      background: #d4af37;
      color: #111;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      transition: 0.3s;
    }

    .btn:hover {
      background: #f2cf57;
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      .container {
        padding: 40px 20px;
      }

      h1 {
        font-size: 32px;
      }

      p {
        font-size: 15px;
      }

      .logo {
        width: 90px;
        height: 90px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <img src="logo.jpg" class="logo" alt="Jai Durga Construction Logo">

    <div class="check">✓</div>

    <h1>Thank You!</h1>

    <p>
      Your enquiry has been successfully submitted to
      <b style="color:#d4af37;">Jai Durga Construction</b>.
      <br><br>
      Our team will review your request and get back to you within 24 hours.
    </p>

    <a href="index.html" class="btn">Back to Home</a>

  </div>

</body>
</html>
